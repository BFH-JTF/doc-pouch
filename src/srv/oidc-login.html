<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>DocPouch - Login</title>
    <style nonce="__NONCE__">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .info {
            background: #e3f2fd;
            color: #1976d2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .client-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .client-info strong {
            color: #333;
        }

        .client-info.hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <img alt="DocPouch" class="logo-img" src="/oidc/static/docPouch.png">
        <h1>DocPouch</h1>
        <p>Sign in to continue</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div id="clientInfo" class="client-info hidden">
        <strong>Client:</strong> <span id="clientName"></span>
    </div>

    <div class="info">
        Use your DocPouch credentials to sign in. If you don't have an account, contact your administrator.
    </div>

    <form id="loginForm" action="/interaction/__UID__" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" autocomplete="username" autofocus name="name" required type="text">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" autocomplete="current-password" name="password" required type="password">
        </div>

        <button id="submitButton" type="submit">Sign In</button>
    </form>
</div>

<script nonce="__NONCE__">
    const UID = '__UID__';

    // Display client info if available
    async function loadInteractionDetails() {
        try {
            const response = await fetch(`/interaction/${UID}/details`);
            if (response.ok) {
                const data = await response.json();
                if (data.clientName) {
                    document.getElementById('clientInfo').classList.remove('hidden');
                    document.getElementById('clientName').textContent = data.clientName;
                }
            }
        } catch (err) {
            console.error('Failed to load interaction details:', err);
        }
    }

    loadInteractionDetails();

    // Show error message from URL params (redirected back after failed login)
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
        const errorMessage = document.getElementById('errorMessage');
        errorMessage.textContent = params.get('error');
        errorMessage.classList.add('show');
    }

    document.getElementById('loginForm').addEventListener('submit', () => {
        const submitButton = document.getElementById('submitButton');
        submitButton.disabled = true;
        submitButton.textContent = 'Signing in...';
    });
</script>
</body>
</html>
