services:
  docPouch:
    image: ghcr.io/bfh-jtf/doc-pouch:latest
    ports:
      - "3030:3030"
    volumes:
      - "./db:/app/db"
      - "./log:/app/log"
    environment:
      - PORT=3030
      - MEMORY_ONLY=false
      - PREFIX=test_
      - JWT_SECRET=your-secure-jwt-secret-here
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - ALLOWED_HEADERS=Content-Type,Authorization
    restart: unless-stopped
