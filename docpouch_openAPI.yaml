openapi: 3.0.1
info:
  title: DocPouch
  description: A light-weight, document-based database including user-management. DocPouch is meant for tests, development or internal applications, where security is not a major factor. The database is file and text based and therefore also not layed out for high performance. Instead the main focus of DocPouch is simplicity and a small footprint.
  version: 1.24.1
servers:
  - url: 'http://localhost:3030'
    description: 'Local development server'
tags:
  - name: administration
    description: User management endpoints
  - name: documents
    description: Document management endpoints
  - name: data structures
    description: Data structure management endpoints
  - name: openid connect
    description: OpenID Connect (OIDC) provider endpoints

paths:
  /users/login:
    post:
      summary: Authenticate a user
      tags:
        - administration
      requestBody:
        description: "User credentials for authentication"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        200:
          description: "User has been successfully logged in and the new JSON web token is provided"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: "JWT authentication token"
                  isAdmin:
                    type: boolean
                    description: "Whether the user has administrator privileges"
                  userName:
                    type: string
                    description: "The user's display name"
                  _id:
                    type: string
                    description: "The unique identifier of the logged-in user"
                required:
                  - token
                  - isAdmin
                  - userName
                  - _id
        401:
          description: "Invalid credentials"
        404:
          description: "User not found"

  /users/list:
    get:
      summary: List user information
      description: Get all user information as admin or your user information as user
      tags:
        - administration
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      responses:
        200:
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDisplay"
        401:
          description: "User does not have access to full user list"

  /users/update/{userID}:
    patch:
      summary: Update user
      description: Update any user (as admin) or your own user applying the provided attributes
      tags:
        - administration
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique user ID"
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        description: "Data object containing only the attributes to be updated"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        200:
          description: "User has been successfully updated"
        401:
          description: "Not authorized to update this user"
        404:
          description: "User not found"

  /users/create:
    post:
      summary: Create a new user
      tags:
        - administration
      security:
        - adminAuth: [ ]
      requestBody:
        description: "JSON body with all information to create a new user"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreation"
      responses:
        200:
          description: "User account has been successfully created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDisplay"
        401:
          description: "User is unauthorized to create new users"

  /users/remove/{userID}:
    delete:
      summary: Remove a user and all its documents
      tags:
        - administration
      security:
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique user ID"
          name: userID
          required: true
          schema:
            type: string
      responses:
        200:
          description: "User successfully deleted"
        401:
          description: "Not authorized to delete this user"
        404:
          description: "User not found"

  /docs/create:
    post:
      summary: Create a new document
      description: |
        Creates a new document. By default, the document is owned by the
        authenticated caller. If the `anonymous` property is set to `true` in
        the request body, the document is instead owned by the admin user and
        the creator's user ID is discarded. Anonymous creation requires the
        `ANONYMOUS_DOCUMENTS_ENABLED` environment variable to be set to `true`
        on the server; when the flag is off the request is rejected with
        HTTP 400 (error code `ANONYMOUS_DOCUMENTS_DISABLED`).
      tags:
        - documents
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      requestBody:
        description: "JSON body with all the information to create a new document"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDocument"
      responses:
        200:
          description: "Document has been successfully created. The new id of the document can be read from the response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        400:
          description: |
            Bad request. Returned, for example, when
            `ANONYMOUS_DOCUMENTS_ENABLED` is `false` on the server but the
            request body includes `"anonymous": true`. The response body
            contains an error code and a human-readable message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: "User is unauthorized to create new documents"

  /docs/list:
    get:
      summary: List documents
      description: "List all documents readable by the user. This includes documents owned by the user, shared with the user's group or department, or marked as public. For administrators, all documents are listed."
      tags:
        - documents
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      responses:
        200:
          description: "Array of documents with the content attribute omitted"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        401:
          description: "Not authorized to list documents"

  /docs/fetch:
    post:
      summary: "Get a document based on a query object."
      description: "Fetch documents matching the query criteria that the user has access to. This includes own documents, documents shared with group/department, or public documents. Administrators can fetch any document."
      tags:
        - documents
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      requestBody:
        required: true
        description: "An object describing the query to fetch the documents."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentQuery"
      responses:
        200:
          description: "Documents matching the query criteria"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        401:
          description: "User does not have access to this document"
        404:
          description: "Document with this ID could not be found"

  /docs/update/{documentID}:
    patch:
      summary: Update a document by applying the provided attributes
      description: "Users can update their own documents fully. Users with shared access (via group or department) can only update the content field. Only document owners can change sharing settings."
      tags:
        - documents
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique document ID"
          name: documentID
          required: true
          schema:
            type: string
      requestBody:
        description: "Data object containing only the attributes to be updated"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Document"
      responses:
        200:
          description: "Document has been successfully updated"
        401:
          description: "Not authorized to update this document"
        404:
          description: "Document not found"

  /docs/remove/{documentID}:
    delete:
      summary: Remove a document
      tags:
        - documents
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique document ID"
          name: documentID
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Document successfully deleted"
        401:
          description: "Not authorized to delete this document"
        404:
          description: "Document not found"

  /structures/create:
    post:
      summary: Create a new data structure
      tags:
        - data structures
      security:
        - adminAuth: [ ]
      requestBody:
        description: "JSON body with all the information to create a new data structure"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStructureCreation"
      responses:
        200:
          description: "Structure has been successfully created. The new id of the structure can be read from the response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStructure"
        401:
          description: "User is unauthorized to create new data structures"

  /structures/list:
    get:
      summary: Get all data structures
      description: "Fetch all data structures"
      tags:
        - data structures
      security:
        - userAuth: [ ]
        - adminAuth: [ ]
      responses:
        200:
          description: "Array of data structures"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataStructure"
        401:
          description: "Not authorized to list data structures"

  /structures/update/{structureID}:
    patch:
      summary: Update the selected data structure applying the provided attributes
      tags:
        - data structures
      security:
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique structure ID"
          name: structureID
          required: true
          schema:
            type: string
      requestBody:
        description: "Data object containing only the attributes to be updated"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStructure"
      responses:
        200:
          description: "Structure has been successfully updated"
        401:
          description: "Not authorized to update this structure"
        404:
          description: "Structure not found"

  /structures/remove/{structureID}:
    delete:
      summary: Remove a data structure
      tags:
        - data structures
      security:
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique structure ID"
          name: structureID
          required: true
          schema:
            type: string
      responses:
        200:
          description: "Structure successfully deleted"
        401:
          description: "Not authorized to delete this structure"
        404:
          description: "Structure not found"



  /version/check:
    get:
      summary: Check for application updates
      description: "Check if a newer version of the application is available."
      tags:
        - administration
      responses:
        200:
          description: "Update check result"
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasUpdate:
                    type: boolean
                    description: "Whether a newer version is available"
                  currentVersion:
                    type: string
                    description: "The current application version"
                  latestVersion:
                    type: string
                    description: "The latest available version"
        503:
          description: "Update check not available yet"

  /database/export:
    get:
      summary: Export the database
      description: "Export full data as ZIP/JSON or export a single collection as JSON. Only available to administrators."
      tags:
        - administration
      security:
        - adminAuth: [ ]
      parameters:
        - in: query
          name: scope
          required: false
          description: "Which data scope to export"
          schema:
            type: string
            enum: [ all, users, documents, structures ]
            default: all
        - in: query
          name: format
          required: false
          description: "Export format. ZIP is only supported for scope=all."
          schema:
            type: string
            enum: [ zip, json ]
            default: zip
      responses:
        200:
          description: "Export payload as ZIP archive or JSON file"
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                  - type: array
                  - type: object
        401:
          description: "Not authorized to export database"
        403:
          description: "Only admins can export the database"

  /database/import:
    post:
      summary: Import the database
      description: "Import data from JSON (full or scoped) or ZIP (full only). Only available to administrators."
      tags:
        - administration
      security:
        - adminAuth: [ ]
      requestBody:
        required: true
        content:
          'multipart/form-data':
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "JSON file (scoped or full) or ZIP file (full import)"
                scope:
                  type: string
                  enum: [ all, users, documents, structures ]
                  default: all
                  description: "Import target scope. ZIP supports only scope=all."
                mode:
                  type: string
                  enum: [ replace, add, skip ]
                  default: replace
                  description: "Import mode: replace (overwrite same _id), add (new _id for same _id), skip (ignore same _id)"
      responses:
        200:
          description: "Database imported successfully"
        400:
          description: "Invalid file format"
        401:
          description: "Not authorized to import database"
        403:
          description: "Only admins can import the database"

  /.well-known/openid-configuration:
    get:
      summary: OpenID Connect discovery
      description: "Returns the OpenID Connect provider metadata. This is the standard OIDC discovery endpoint that all OIDC clients use to discover the provider's configuration."
      tags:
        - openid connect
      responses:
        200:
          description: "OIDC provider metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcDiscovery"

  /oidc/auth:
    get:
      summary: OIDC Authorization endpoint
      description: "Standard OpenID Connect Authorization endpoint. Initiates the authentication request. Follows the OIDC Core specification."
      tags:
        - openid connect
      parameters:
        - in: query
          name: client_id
          required: true
          schema:
            type: string
          description: "Client identifier"
        - in: query
          name: response_type
          required: true
          schema:
            type: string
            enum: [ code, id_token, "code id_token" ]
          description: "OAuth response type"
        - in: query
          name: scope
          required: true
          schema:
            type: string
          description: "Space-separated list of scopes (e.g. openid profile)"
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
            format: uri
          description: "Client redirect URI"
        - in: query
          name: state
          required: false
          schema:
            type: string
          description: "Opaque value used to maintain state"
        - in: query
          name: nonce
          required: false
          schema:
            type: string
          description: "String value used to associate a client session with an ID token"
      responses:
        302:
          description: "Redirect to login page or redirect URI"
        400:
          description: "Invalid request"

  /oidc/token:
    post:
      summary: OIDC Token endpoint
      description: "Standard OpenID Connect Token endpoint. Exchanges authorization codes for tokens and refreshes tokens."
      tags:
        - openid connect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [ authorization_code, refresh_token, client_credentials ]
                  description: "OAuth grant type"
                code:
                  type: string
                  description: "Authorization code (required for authorization_code grant)"
                refresh_token:
                  type: string
                  description: "Refresh token (required for refresh_token grant)"
                redirect_uri:
                  type: string
                  format: uri
                  description: "Redirect URI (required for authorization_code grant)"
                client_id:
                  type: string
                  description: "Client identifier"
                client_secret:
                  type: string
                  description: "Client secret (required for confidential clients)"
              required:
                - grant_type
      responses:
        200:
          description: "Token response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcTokenResponse"
        400:
          description: "Invalid request"

  /oidc/userinfo:
    get:
      summary: OIDC UserInfo endpoint
      description: "Standard OpenID Connect UserInfo endpoint. Returns claims about the authenticated user."
      tags:
        - openid connect
      security:
        - userAuth: [ ]
      responses:
        200:
          description: "User claims"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcUserInfo"
        401:
          description: "Invalid or missing access token"

  /oidc/jwks:
    get:
      summary: OIDC JWKS endpoint
      description: "Returns the JSON Web Key Set used by the OIDC provider for token signing. Used by clients to verify ID token signatures."
      tags:
        - openid connect
      responses:
        200:
          description: "JWKS response"
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      description: "JSON Web Key"

  /oidc/end_session:
    get:
      summary: OIDC End Session endpoint
      description: "Destroys the user's OIDC session and redirects to the post-logout redirect URI. This is the standard OIDC logout endpoint."
      tags:
        - openid connect
      parameters:
        - in: query
          name: post_logout_redirect_uri
          required: true
          schema:
            type: string
            format: uri
          description: "URI to redirect the user after logout. Must be registered in the client's post_logout_redirect_uris."
        - in: query
          name: id_token_hint
          required: false
          schema:
            type: string
          description: "ID token previously issued to the client. Used to verify the user's identity."
      responses:
        302:
          description: "Redirect to post_logout_redirect_uri"
        400:
          description: "Invalid or missing parameters"

  /oidc/revocation:
    post:
      summary: OIDC Token Revocation endpoint
      description: "Revokes an access or refresh token, rendering it unusable. Clients can call this to explicitly invalidate tokens."
      tags:
        - openid connect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: "The token to be revoked"
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: "Type of token to be revoked (optional but recommended)"
              required:
                - token
      responses:
        200:
          description: "Token successfully revoked"
        401:
          description: "Invalid or missing client credentials"
        400:
          description: "Invalid token or parameters"

  /oidc/par:
    post:
      summary: OIDC Pushed Authentication Request (PAR) endpoint
      description: "Pushes an authorization request to the server and receives a unique request URI. Used for improved security and pre-authorization."
      tags:
        - openid connect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                response_type:
                  type: string
                  enum: [code]
                  description: "OAuth response type"
                client_id:
                  type: string
                  description: "Client identifier"
                redirect_uri:
                  type: string
                  format: uri
                  description: "Redirect URI"
                scope:
                  type: string
                  description: "OAuth scope"
                state:
                  type: string
                  description: "Opaque value for CSRF protection"
                code_challenge:
                  type: string
                  description: "PKCE code challenge"
                code_challenge_method:
                  type: string
                  enum: [S256, plain]
                  description: "PKCE code challenge method"
              required:
                - response_type
                - client_id
                - redirect_uri
                - scope
                - state
                - code_challenge
                - code_challenge_method
      responses:
        200:
          description: "Authorization request created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_uri:
                    type: string
                    description: "URI to be used in the authorization request"
                  expires_in:
                    type: integer
                    description: "Seconds until request_uri expires"
        400:
          description: "Invalid authorization request parameters"

  /oidc/reg:
    post:
      summary: Register a new OIDC client (dynamic registration)
      description: "Register a new OIDC client application dynamically. Requires an initial access token provided in the Authorization header."
      tags:
        - openid connect
      security:
        - oidcRegistrationToken: [ ]
      requestBody:
        description: "Client metadata for registration"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcClientRegistration"
      responses:
        201:
          description: "Client successfully registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcClientResponse"
        401:
          description: "Invalid or missing registration access token"

  /oidc/reg/{clientId}:
    get:
      summary: Read OIDC client details
      description: "Retrieve the registration state of an existing OIDC client. Requires the registration access token issued during client registration."
      tags:
        - openid connect
      security:
        - oidcRegistrationToken: [ ]
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
          description: "The client identifier"
      responses:
        200:
          description: "Client details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcClientResponse"
        401:
          description: "Invalid or missing registration access token"

    put:
      summary: Update OIDC client registration
      description: "Update the registration of an existing OIDC client. Requires the registration access token issued during client registration."
      tags:
        - openid connect
      security:
        - oidcRegistrationToken: [ ]
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
          description: "The client identifier"
      requestBody:
        description: "Updated client metadata"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcClientRegistration"
      responses:
        200:
          description: "Client updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcClientResponse"
        401:
          description: "Invalid or missing registration access token"

    delete:
      summary: Delete OIDC client registration
      description: "Delete an existing OIDC client. Requires the registration access token issued during client registration."
      tags:
        - openid connect
      security:
        - oidcRegistrationToken: [ ]
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
          description: "The client identifier"
      responses:
        204:
          description: "Client deleted successfully"
        401:
          description: "Invalid or missing registration access token"

  /interaction/{uid}:
    get:
      summary: OIDC login page
      description: "Serves the OIDC login page for user authentication during the authorization flow."
      tags:
        - openid connect
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: "Interaction UID"
      responses:
        200:
          description: "Login page HTML"
          content:
            text/html:
              schema:
                type: string
        400:
          description: "Invalid or expired login session"

  /interaction/{uid}/details:
    get:
      summary: OIDC interaction details
      description: "Returns details about an ongoing OIDC interaction, such as the client name and prompt type."
      tags:
        - openid connect
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: "Interaction UID"
      responses:
        200:
          description: "Interaction details"
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientName:
                    type: string
                    description: "Name of the requesting client"
                  prompt:
                    type: string
                    description: "Type of interaction prompt (e.g. login, consent)"
        400:
          description: "Invalid interaction"

  /api-keys/create:
    post:
      summary: Create a new API key
      description: |
        Creates a new long-lived API key for MCP clients and scripts.
        The full key is returned only once - copy it immediately.
        Maximum 10 keys per user.
      tags:
        - administration
      security:
        - userAuth: [ ]
      requestBody:
        description: "API key creation parameters"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        200:
          description: "API key created successfully. Full key is shown only once."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        400:
          description: "Invalid request (e.g., missing name)"
        500:
          description: "Maximum keys reached or server error"

  /api-keys/list:
    get:
      summary: List your API keys
      description: Get all API keys belonging to the authenticated user. Does not return the full key, only metadata.
      tags:
        - administration
      security:
        - userAuth: [ ]
      responses:
        200:
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyListItem"
        401:
          description: "Unauthorized"

  /api-keys/{keyId}:
    delete:
      summary: Delete an API key
      description: Delete one of your own API keys
      tags:
        - administration
      security:
        - userAuth: [ ]
      parameters:
        - in: path
          description: "Unique API key ID"
          name: keyId
          required: true
          schema:
            type: string
      responses:
        200:
          description: "API key deleted successfully"
        404:
          description: "API key not found"
        401:
          description: "Not authorized to delete this key"

  /api-keys/admin/list:
    get:
      summary: Admin - List all API keys
      description: List all API keys across all users (admin only)
      tags:
        - administration
      security:
        - adminAuth: [ ]
      parameters:
        - in: query
          description: "Filter by user ID (optional)"
          name: userId
          required: false
          schema:
            type: string
      responses:
        200:
          description: List of all API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyListItem"
        401:
          description: "Not authorized (admin only)"

  /api-keys/admin/{keyId}:
    delete:
      summary: Admin - Revoke any API key
      description: Revoke any user's API key (admin only)
      tags:
        - administration
      security:
        - adminAuth: [ ]
      parameters:
        - in: path
          description: "Unique API key ID"
          name: keyId
          required: true
          schema:
            type: string
      responses:
        200:
          description: "API key revoked successfully"
        404:
          description: "API key not found"
        401:
          description: "Not authorized (admin only)"

components:
  schemas:
    Document:
      type: object
      description: "Data element describing a custom document"
      properties:
        _id:
          type: string
          description: "Unique ID of document. Only used for queries and deletions"
          example: "3ufDC0Rh5g7arSC9"
        owner:
          type: string
          description: "The _id of the user who owns this document"
          example: "p3O5LB4T6C4PgkvW"
        title:
          type: string
          description: "The title of the document"
          example: "Mission Statement"
        description:
          type: string
          description: "The description of the document"
          example: "A brief description of the document"
        type:
          type: integer
          description: "Type of document - can be used by user for document organization"
          example: 17
        subType:
          type: integer
          description: "Sub-type of document - can be used by user for document organization"
          example: 11
        content:
          type: array
          description: "The content of the document as an array of field objects"
          items:
            type: object
            properties:
              label:
                type: string
                description: "Field label"
              importance:
                type: integer
                description: "Field importance level"
          example: [ { "label": "Document content here", "importance": 0 } ]
        shareWithGroup:
          type: boolean
          description: "If true, the document is shared with all users in the owner's group"
          example: false
        shareWithDepartment:
          type: boolean
          description: "If true, the document is shared with all users in the owner's department"
          example: false
        public:
          type: boolean
          description: "If true, the document can be read by everybody"
          example: false
      required:
        - _id
        - owner
        - title
        - type
        - subType
        - content
        - public

    DocumentQuery:
      type: object
      description: "Query element describing the aspects of a document query"
      properties:
        _id:
          type: string
          description: "Unique ID of document. Only used for queries and deletions"
          example: "3ufDC0Rh5g7arSC9"
        owner:
          type: string
          description: "The _id of the user who owns this document"
          example: "p3O5LB4T6C4PgkvW"
        type:
          type: integer
          description: "Type of document - can be used by user for document organization"
          example: 17
        subType:
          type: integer
          description: "Sub-type of document - can be used by user for document organization"
          example: 11
        title:
          type: string
          description: "The title of the document"
          example: "Mission Statement"
        description:
          type: string
          description: "The description of the document"
          example: "A statement describing the corporate mission or how to achieve the corporate vision"
        shareWithGroup:
          type: boolean
          description: "If true, the document is shared with all users in the owner's group"
          example: false
        shareWithDepartment:
          type: boolean
          description: "If true, the document is shared with all users in the owner's department"
          example: false
        public:
          type: boolean
          description: "If true, the document can be read by everybody"
          example: false
    
    NewDocument:
      type: object
      description: "Data element for creating a new document. The owner field is automatically set from the authenticated user's JWT token. If `anonymous` is `true`, the document is owned by the admin user instead and the creator's user ID is discarded."
      properties:
        title:
          type: string
          description: "The title of the document"
          example: "Mission Statement"
        description:
          type: string
          description: "The description of the document"
          example: "A brief description of the document"
        type:
          type: integer
          description: "Type of document - can be used by user for document organization"
          example: 17
        subType:
          type: integer
          description: "Sub-type of document - can be used by user for document organization"
          example: 11
        content:
          type: array
          description: "The content of the document as an array of field objects"
          items:
            type: object
            properties:
              label:
                type: string
                description: "Field label"
              importance:
                type: integer
                description: "Field importance level"
          example: [ { "label": "Document content here", "importance": 0 } ]
        shareWithGroup:
          type: boolean
          description: "If true, the document is shared with all users in the owner's group"
          example: false
        shareWithDepartment:
          type: boolean
          description: "If true, the document is shared with all users in the owner's department"
          example: false
        public:
          type: boolean
          description: "If true, the document can be read by everybody"
          example: false
        anonymous:
          type: boolean
          description: |
            If `true`, the document is owned by the admin user instead of the
            authenticated caller. The creator's user ID is discarded and
            cannot be recovered from the document. The flag is not stored on
            the document. Requires `ANONYMOUS_DOCUMENTS_ENABLED=true` on the
            server; otherwise the request is rejected with HTTP 400 (error
            code `ANONYMOUS_DOCUMENTS_DISABLED`).
          example: false
          default: false
      required:
        - title
        - type
        - subType
        - content
        - shareWithDepartment
        - shareWithGroup
        - public

    UserDisplay:
      type: object
      description: "Data element describing the user-facing side of a user account"
      properties:
        _id:
          type: string
          description: "A unique not-changeable user ID"
          example: "p3O5LB4T6C4PgkvW"
        name:
          type: string
          description: "User names can be changed at any time and are not necessarily unique. Users are uniquely identified based on their id."
          example: "admin"
        email:
          type: string
          description: "User email address"
          example: "admin@example.com"
        department:
          type: string
          description: "The department the user is part of"
          example: "administration"
        group:
          type: string
          description: "The group the user is part of"
          example: "auto-created"
        isAdmin:
          type: boolean
          description: "Whether the user has administrator privileges"
          example: true
      required:
        - _id
        - name
        - department
        - group

    UserCreation:
      type: object
      description: "Data element needed to trigger user creation"
      properties:
        name:
          type: string
          example: "Darth Vader"
          description: "User names can be changed at any time and are not necessarily unique. Users are uniquely identified based on their id."
        password:
          type: string
          example: "darths-secret"
          description: "Password is used as main authentication element"
        email:
          type: string
          example: "darth@gmail.com"
          description: "User email address"
        department:
          type: string
          description: "The department the user is part of"
          example: "Administration"
        group:
          type: string
          description: "The group the user is part of"
          example: "The Magentas"
        isAdmin:
          type: boolean
          example: false
          description: "Flag indicating if the user has administrator privileges"
      required:
        - name
        - password
        - isAdmin
        - department
        - group

    UserUpdate:
      type: object
      description: "Data element needed to trigger a user update"
      properties:
        name:
          type: string
          example: "Darth Vader"
          description: "User names can be changed at any time and are not necessarily unique. Users are uniquely identified based on their id."
        password:
          type: string
          example: "darths-secret"
          description: "Password is used as main authentication element"
        email:
          type: string
          example: "darth@gmail.com"
          description: "User email address"
        isAdmin:
          type: boolean
          example: false
          description: "Flag indicating if the user has administrator privileges"
        department:
          type: string
          description: "The department the user is part of"
          example: "Administration"
        group:
          type: string
          description: "The group the user is part of"
          example: "The Magentas"

    UserLogin:
      type: object
      description: "Data element needed for user authentication"
      properties:
        name:
          type: string
          example: "Darth Vader"
          description: "User name for authentication"
        password:
          type: string
          example: "darths-secret"
          description: "Password is used as main authentication element"
      required:
        - name
        - password

    ErrorResponse:
      type: object
      description: "Standard error response returned for non-success HTTP statuses where a body is provided."
      properties:
        error:
          type: string
          description: "A short, machine-readable error code identifying the failure mode."
          example: "ANONYMOUS_DOCUMENTS_DISABLED"
        message:
          type: string
          description: "A human-readable error message describing the failure."
          example: "Anonymous document creation is disabled on this server."
      required:
        - error

    ApiKeyCreate:
      type: object
      description: "Data element needed to create an API key"
      properties:
        name:
          type: string
          description: "Descriptive name to identify the API key"
          example: "Home Assistant MCP"
        expiresInDays:
          type: integer
          description: "Number of days until the key expires. Omit or set to undefined for no expiry."
          example: 90
      required:
        - name

    ApiKeyCreated:
      type: object
      description: "Response returned immediately after API key creation. The full key is only shown once."
      properties:
        key:
          type: string
          description: "The full API key. Copy and store securely - it will not be shown again."
          example: "docpouch_key_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        keyPrefix:
          type: string
          description: "First 8 characters of the key for identification"
          example: "xxxxxxxx"
        name:
          type: string
          description: "The name given to this API key"
          example: "Home Assistant MCP"
        createdAt:
          type: integer
          description: "Unix timestamp of when the key was created"
          example: 1750000000000
        expiresAt:
          type: integer
          description: "Unix timestamp of when the key expires. Not present if the key never expires."
          example: 1750860000000
      required:
        - key
        - keyPrefix
        - name
        - createdAt

    ApiKeyListItem:
      type: object
      description: "API key metadata returned when listing keys"
      properties:
        _id:
          type: string
          description: "Unique identifier for this API key"
          example: "apikey_1234567890_abc"
        name:
          type: string
          description: "The name given to this API key"
          example: "Home Assistant MCP"
        keyPrefix:
          type: string
          description: "First 8 characters of the key for identification"
          example: "xxxxxxxx"
        createdAt:
          type: integer
          description: "Unix timestamp of when the key was created"
          example: 1750000000000
        lastUsedAt:
          type: integer
          description: "Unix timestamp of when the key was last used. Not present if never used."
          example: 1750010000000
        expiresAt:
          type: integer
          description: "Unix timestamp of when the key expires. Not present if the key never expires."
          example: 1750860000000
      required:
        - _id
        - name
        - keyPrefix
        - createdAt

    DataStructure:
      type: object
      description: "Data element describing a data structure"
      properties:
        _id:
          type: string
          description: "Unique ID of data structure, is used as type for documents"
          example: "tt5vo04DN3jm8Bqe"
        name:
          type: string
          description: "The name of the structure"
          example: "City Info"
        description:
          type: string
          description: "The description of the structure"
          example: "Data resulting from Vision-Mission-Value-Canvas"
        fields:
          type: array
          description: "Array of fields defining the structure"
          items:
            $ref: "#/components/schemas/DataField"
      required:
        - name
        - fields

    DataStructureCreation:
      type: object
      description: "Data element describing a data structure"
      properties:
        name:
          type: string
          description: "The name of the structure"
          example: "City Info"
        description:
          type: string
          description: "The description of the structure"
          example: "Data resulting from Vision-Mission-Value-Canvas"
        type:
          type: number
          description: "Numeric type of the structure (must be provided together with subType)"
        subType:
          type: number
          description: "Numeric subtype of the structure (must be provided together with type)"
        fields:
          type: array
          description: "Array of fields defining the structure"
          items:
            $ref: "#/components/schemas/DataField"
      required:
        - name
        - type
        - subType
        - fields

    DataField:
      type: object
      description: "Structure element describing one field in a data structure"
      properties:
        name:
          type: string
          description: "Field name"
          example: "Mission value statement"
        type:
          type: string
          description: "Determines the type of the data field"
          enum: ["number", "string", "boolean", "array", "structure"]
          example: "boolean"
        items:
          type: string
          description: "Type of array items or reference to other existing data structures"
          example: "tt5vo04DN3jm8Bqe"
      required:
        - name
        - type

    OidcDiscovery:
      type: object
      description: "OpenID Connect provider metadata"
      properties:
        issuer:
          type: string
          description: "OIDC issuer URL"
        authorization_endpoint:
          type: string
          format: uri
          description: "Authorization endpoint URL"
        token_endpoint:
          type: string
          format: uri
          description: "Token endpoint URL"
        userinfo_endpoint:
          type: string
          format: uri
          description: "UserInfo endpoint URL"
        jwks_uri:
          type: string
          format: uri
          description: "JWKS endpoint URL"
        registration_endpoint:
          type: string
          format: uri
          description: "Dynamic Client Registration endpoint URL"
        scopes_supported:
          type: array
          items:
            type: string
          description: "Supported OAuth scopes"
        response_types_supported:
          type: array
          items:
            type: string
          description: "Supported response types"
        grant_types_supported:
          type: array
          items:
            type: string
          description: "Supported grant types"
        subject_types_supported:
          type: array
          items:
            type: string
          description: "Supported subject types"
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: "Supported ID token signing algorithms"
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: "Supported token endpoint authentication methods"

    OidcTokenResponse:
      type: object
      description: "OIDC token response"
      properties:
        access_token:
          type: string
          description: "The access token"
        token_type:
          type: string
          description: "Token type (e.g. Bearer)"
        expires_in:
          type: integer
          description: "Token expiration time in seconds"
        id_token:
          type: string
          description: "ID token (if openid scope was requested)"
        refresh_token:
          type: string
          description: "Refresh token (if offline_access scope was requested)"
        scope:
          type: string
          description: "Granted scopes"

    OidcUserInfo:
      type: object
      description: "OIDC UserInfo claims"
      properties:
        sub:
          type: string
          description: "Subject identifier (user ID)"
        name:
          type: string
          description: "User display name"
        email:
          type: string
          description: "User email address"
        department:
          type: string
          description: "User department"
        group:
          type: string
          description: "User group"

    OidcClientRegistration:
      type: object
      description: "Client metadata for OIDC dynamic client registration"
      properties:
        client_name:
          type: string
          description: "Human-readable client name"
          example: "My OIDC Client"
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: "List of allowed redirect URIs"
          example: [ "http://localhost:8080/cb" ]
        grant_types:
          type: array
          items:
            type: string
          description: "List of OAuth grant types"
          example: [ "authorization_code", "refresh_token" ]
        response_types:
          type: array
          items:
            type: string
          description: "List of OAuth response types"
          example: [ "code" ]
        scope:
          type: string
          description: "Space-separated list of default scopes"
          example: "openid profile"
        token_endpoint_auth_method:
          type: string
          enum: [ client_secret_basic, client_secret_post, none ]
          description: "Token endpoint authentication method"
          example: "client_secret_basic"
        application_type:
          type: string
          enum: [ web, native ]
          description: "Application type"
          example: "web"
        logo_uri:
          type: string
          format: uri
          description: "URL for the client logo"
        client_uri:
          type: string
          format: uri
          description: "URL of the client application"
        policy_uri:
          type: string
          format: uri
          description: "URL of the client's privacy policy"
        tos_uri:
          type: string
          format: uri
          description: "URL of the client's terms of service"
        post_logout_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: "List of allowed post-logout redirect URIs"
          example: ["http://localhost:8080/"]
      required:
        - client_name
        - redirect_uris

    OidcClientResponse:
      type: object
      description: "Response from OIDC client registration"
      properties:
        client_id:
          type: string
          description: "Unique client identifier"
        client_secret:
          type: string
          description: "Client secret (for confidential clients)"
        client_secret_expires_at:
          type: integer
          description: "Timestamp when the client secret expires (0 if never)"
        client_id_issued_at:
          type: integer
          description: "Timestamp when the client was registered"
        registration_access_token:
          type: string
          description: "Token for subsequent client management operations"
        registration_client_uri:
          type: string
          format: uri
          description: "URL for managing this client registration"
        client_name:
          type: string
          description: "Human-readable client name"
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: "Allowed redirect URIs"
        grant_types:
          type: array
          items:
            type: string
          description: "Grant types"
        response_types:
          type: array
          items:
            type: string
          description: "Response types"
        scope:
          type: string
          description: "Default scopes"
        token_endpoint_auth_method:
          type: string
          description: "Token endpoint authentication method"

  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Initial access token or registration access token for OIDC dynamic client registration. Set via the OIDC_REGISTRATION_TOKEN environment variable."