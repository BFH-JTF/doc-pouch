# This file configures semantic-release - a customizable release automation tool - using GitHub actions.

name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify token
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "RELEASE_TOKEN is empty!"
          else
            echo "RELEASE_TOKEN is set (length: ${#RELEASE_TOKEN})"
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Update OpenAPI version
        run: |
          VERSION=$(jq -r '.version' package.json)
          sed -i "s/version: [0-9.]\+/version: $VERSION/" docpouch_openAPI.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docpouch_openAPI.yaml
          git diff-index --quiet HEAD || git commit -m "docs: update OpenAPI version to $VERSION"
          git push
