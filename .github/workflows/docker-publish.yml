name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t my-image:latest .

      - name: Push Docker image
        run: |
          echo "Pushing Docker image..."

      - name: Log image tags
        run: |
          echo "Image tags are: my-image:latest, my-image:${{ github.sha }}"

      - name: Report failure
        if: failure()
        run: |
          echo "The Docker publish workflow failed!"